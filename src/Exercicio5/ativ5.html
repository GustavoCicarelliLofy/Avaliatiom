<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de ROI</title>
  <link rel="stylesheet" href="ativ5.css">
</head>
<body>
  <div class="container">
    <h1>Cálculo de ROI</h1>

    <label for="investimento">Valor Investido (R$)</label>
    <input type="number" id="investimento" placeholder="Ex: 100">

    <label for="receita">Receita Obtida (R$)</label>
    <input type="number" id="receita" placeholder="Ex: 150">

    <button id="calcularRoi">Calcular ROI</button>

    <div class="result" id="resultado"></div>
  </div>

  <script src="ativ5.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
